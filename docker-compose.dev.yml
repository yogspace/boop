# Local MongoDB for `pnpm dev` – on 27019, so it does not collide with other
# MongoDBs on this machine. Start: make up-db
services:
  mongo:
    image: mongo:8
    ports:
      - "127.0.0.1:27019:27017"
    volumes:
      - mongo_dev_data:/data/db
    logging:
      driver: none
    restart: unless-stopped

volumes:
  mongo_dev_data:
